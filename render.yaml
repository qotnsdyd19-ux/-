services:
  - type: web
    name: hzo-experimental-inference
    runtime: docker
    dockerfilePath: ./Dockerfile.experimental
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: HZO_CORS_ORIGINS
        value: https://qotnsdyd19-ux.github.io
      - key: HZO_TRAIN_TOKEN
        generateValue: true
