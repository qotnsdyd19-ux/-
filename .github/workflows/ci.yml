name: Validate research workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56 supports Ubuntu 24.04; avoid ubuntu-latest's 26.04 migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/build_site.py
      - run: git diff --exit-code -- data docs
      - run: python -m playwright install --with-deps chromium
      - name: Functional browser checks
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --bind 127.0.0.1 --directory docs > /tmp/hzo-static.log 2>&1 &
          static_pid=$!
          HZO_READ_ONLY=1 python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8501 > /tmp/hzo-streamlit.log 2>&1 &
          streamlit_pid=$!
          trap 'kill "$static_pid" "$streamlit_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8501/_stcore/health
          python scripts/browser_smoke.py
          python tests/browser_inference.py
      - name: Container startup and unavailable-model checks
        shell: bash
        run: |
          set -euo pipefail
          docker build -t hzo-inference-ci .
          hzo_container=$(docker run --detach --rm --env HZO_MODEL_DIR=/tmp/hzo-no-models --publish 127.0.0.1:9080:8080 hzo-inference-ci)
          trap 'docker stop "$hzo_container"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:9080/healthz
          python -c 'import requests; assert requests.get("http://127.0.0.1:9080/readyz").status_code == 503; assert requests.get("http://127.0.0.1:9080/v1/models").json()["models"] == []'
